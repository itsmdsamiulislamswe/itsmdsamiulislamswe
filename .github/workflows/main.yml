name: Generate Animation

on:
  # প্রতিদিন নিজে থেকে বা ম্যানুয়ালি রান হবে
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ১. আপনার রিপোজিটরি চেকআউট করা
      - name: Checkout
        uses: actions/checkout@v3

      # ২. স্নেক অ্যানিমেশন জেনারেট করা
      - name: Generate patorjk/github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: itsmdsamiulislamswe
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ৩. জেনারেট হওয়া ফাইলগুলো একটি আলাদা ব্রাঞ্চে (output) পুশ করা
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
